[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanopore-realdata-workflow"
version = "0.4.1"
description = "Detached, failure-tolerant real Nanopore classification with optional PCR evaluation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Peter Thorpe"},
]
dependencies = [
    "PyYAML>=6",
]

[project.optional-dependencies]
workflow = [
    "snakemake>=9,<10",
    "snakemake-executor-plugin-slurm>=1.9,<2",
]
test = [
    "build>=1.2",
    "coverage[toml]>=7.6",
    "pytest>=8",
    "ruff>=0.12",
]

[project.scripts]
nanopore-realdata = "nanopore_realdata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nanopore_realdata = ["Snakefile"]

[tool.coverage.run]
branch = true
source = ["nanopore_realdata"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
