schema_version: 2

run:
  id: real_reads_classifier_benchmark_20260806
  output_directory: /gpfs/uod-scale-01/cluster/gjb_lab/pthorpe001/2026_plasmodium_kraken_sensitivity/runs/real_reads_classifier_benchmark_20260806

inputs:
  samples: dundee_real_reads_20260806.samples.tsv
  read_state: host_removed

host:
  reference: ""
  index: ""

databases:
  kraken2: /home/pthorpe001/data/project_back_up_2024/kraken_bact_virus_plasmo_fungal
  metabuli: /gpfs/uod-scale-01/cluster/gjb_lab/pthorpe001/databases/metabuli/custom_metabuli_db
  kmersutra_panel: /home/pthorpe001/data/databases/kmersutra_db/kmersutra_builds/kmersutra_plasmodium_outgroups_v4_global_candidate_k51_77_101_151_rawontlodbalanced_v046_20260605_150721/species_kmer_panel.tsv.gz

minimap2:
  reference: /home/pthorpe001/data/databases/minimap2/shared_bact_viral_plasmo_refs.cleaned.fa
  # Deliberately rebuild from the cleaned FASTA; the existing MMI filename is
  # associated with the uncleaned FASTA and has no checksum sidecar.
  index: ""
  min_mapq: 15
  min_alignment: 500
  # Failure is captured without suppressing successful classifier branches.
  failure_policy: continue

execution:
  scratch_root: /tmp
  stage_resources: true
  minimum_scratch_gb: 150
  keep_non_host_fastq: false
  keep_per_read_classifications: true

resources:
  host_threads: 4
  kraken2_threads: 12
  metabuli_threads: 12
  minimap2_threads: 12
  kmersutra_threads: 24
  host_memory_mb: 16000
  kraken2_memory_mb: 96000
  metabuli_memory_mb: 160000
  # The shared classification panel and index may require substantial RAM.
  minimap2_memory_mb: 160000
  kmersutra_memory_mb: 96000
  host_runtime_minutes: 1440
  kraken2_runtime_minutes: 2880
  metabuli_runtime_minutes: 2880
  minimap2_runtime_minutes: 2880
  # This benchmark explicitly uses the Barton 4week QoS for KmerSutra.
  kmersutra_runtime_minutes: 40320

kraken2:
  confidence: 0.0
  failure_policy: continue

metabuli:
  min_score: 0.008
  max_ram_gb: 120
  failure_policy: continue

kmersutra:
  enabled: true
  failure_policy: continue
  # Stop 220 minutes before the four-week allocation to publish status and clean /tmp.
  timeout_minutes: 40100
  screen_preset: exact
  call_preset: lineage_aware
  same_genus_reportable_min_fraction: 0.05
  write_parquet_outputs: false

provenance:
  checksum_inputs: true

reporting:
  focus_taxa:
    - Plasmodium
  top_n: 20
  max_table_rows: 5000
