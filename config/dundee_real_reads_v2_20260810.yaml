schema_version: 3

run:
  id: real_reads_classifier_benchmark_v2_20260810
  output_directory: /gpfs/uod-scale-01/cluster/gjb_lab/pthorpe001/2026_plasmodium_kraken_sensitivity/runs/real_reads_classifier_benchmark_v2_20260810

deployment:
  expected_repository_root: /gpfs/uod-scale-01/cluster/gjb_lab/pthorpe001/2026_plasmodium_kraken_sensitivity/nanopore_metagenomics_workflow
  expected_package_version: 0.4.2
  conda_environment: nanopore_realdata_workflow

inputs:
  samples: dundee_real_reads_v2_20260810.samples.tsv
  pcr_truth: dundee_real_reads_v2_20260810.pcr_truth.tsv
  read_state: host_removed

host:
  reference: ""
  index: ""

databases:
  kraken2: /gpfs/uod-scale-01/cluster/gjb_lab/pthorpe001/project_back_up_2024/kraken_bact_virus_plasmo_fungal
  metabuli: /gpfs/uod-scale-01/cluster/gjb_lab/pthorpe001/databases/metabuli/custom_metabuli_db
  kmersutra_panel: /gpfs/uod-scale-01/cluster/gjb_lab/pthorpe001/databases/kmersutra_db/kmersutra_builds/kmersutra_plasmodium_outgroups_v4_global_candidate_k51_77_101_151_rawontlodbalanced_v046_20260605_150721/species_kmer_panel.tsv.gz

minimap2:
  genome_config: ""
  reference: /home/pthorpe001/data/project_back_up_2024/Janet_genome_databases/genome_to_use/plas_outgrps_genomes_Hard_MASKED.fasta
  required_species:
    - Plasmodium inui
    - Plasmodium cynomolgi
  index: ""
  min_mapq: 15
  min_alignment: 500
  maximum_reference_bases: 12000000000
  index_batch_size_bases: 16000000000
  maximum_index_bytes: 64000000000
  failure_policy: continue

execution:
  scratch_root: /tmp
  stage_resources: true
  minimum_scratch_gb: 150
  keep_non_host_fastq: false
  keep_per_read_classifications: true

resources:
  host_threads: 4
  kraken2_threads: 12
  metabuli_threads: 12
  minimap2_threads: 12
  kmersutra_threads: 24
  host_memory_mb: 16000
  kraken2_memory_mb: 409600
  metabuli_memory_mb: 160000
  minimap2_memory_mb: 160000
  kmersutra_memory_mb: 96000
  host_runtime_minutes: 1440
  kraken2_runtime_minutes: 2880
  metabuli_runtime_minutes: 2880
  minimap2_runtime_minutes: 2880
  kmersutra_runtime_minutes: 40320

slurm:
  account: barton
  partition: barton
  default_qos: ""
  kmersutra_qos: 4week
  array_concurrency:
    kraken2: 1
    metabuli: 1
    minimap2: 2
    kmersutra: 1

kraken2:
  confidence: 0.0
  failure_policy: continue

metabuli:
  min_score: 0.008
  max_ram_gb: 120
  failure_policy: continue

kmersutra:
  enabled: true
  failure_policy: continue
  timeout_minutes: 40100
  screen_preset: exact
  call_preset: lineage_aware
  same_genus_reportable_min_fraction: 0.05
  write_parquet_outputs: false

provenance:
  checksum_inputs: true

reporting:
  focus_taxa:
    - Plasmodium
  top_n: 20
  max_table_rows: 5000
