schema_version: 3

run:
  id: nanopore_real_data_v1
  output_directory: /absolute/path/to/results/nanopore_real_data_v1

deployment:
  # Submission is refused when this does not match the installed repository.
  expected_repository_root: /absolute/path/to/nanopore_metagenomics_workflow
  expected_package_version: 0.4.1
  conda_environment: nanopore_realdata_workflow

inputs:
  samples: /absolute/path/to/samples.tsv
  # Optional. Leave blank for ordinary real-sample classification. When set,
  # every manifest sample must have one explicit independent PCR record.
  pcr_truth: ""
  # Use host_removed when the supplied FASTQs have already been depleted.
  read_state: raw

host:
  # Both values may be blank when inputs.read_state is host_removed.
  reference: /absolute/path/to/host_reference.fasta
  # Leave blank to build one persistent minimap2 host index.
  index: ""

databases:
  kraken2: /absolute/path/to/kraken2_database
  metabuli: /absolute/path/to/metabuli_database
  # May be blank only when kmersutra.enabled is false.
  kmersutra_panel: /absolute/path/to/species_kmer_panel.tsv.gz

minimap2:
  # Prefer a KmerSutra genome configuration so both methods use the same
  # bounded organism set. Set exactly one of genome_config or reference.
  genome_config: /absolute/path/to/kmersutra_genome_config.tsv
  reference: ""
  # Species that the configured reference must explicitly represent. Keep
  # this independent of PCR; add all PCR-positive comparison species when an
  # optional truth table is configured.
  required_species: []
  # Schema v3 always builds and checksums a run-local, single-part index.
  index: ""
  min_mapq: 15
  min_alignment: 500
  maximum_reference_bases: 12000000000
  index_batch_size_bases: 16000000000
  maximum_index_bytes: 64000000000
  failure_policy: continue

execution:
  # Dundee compute jobs expose a job-specific, node-local XFS filesystem here.
  scratch_root: /tmp
  stage_resources: true
  minimum_scratch_gb: 150
  keep_non_host_fastq: false
  keep_per_read_classifications: true

resources:
  host_threads: 16
  kraken2_threads: 12
  metabuli_threads: 12
  minimap2_threads: 12
  kmersutra_threads: 24
  host_memory_mb: 64000
  kraken2_memory_mb: 96000
  metabuli_memory_mb: 160000
  minimap2_memory_mb: 160000
  kmersutra_memory_mb: 96000
  host_runtime_minutes: 1440
  kraken2_runtime_minutes: 2880
  metabuli_runtime_minutes: 2880
  minimap2_runtime_minutes: 2880
  kmersutra_runtime_minutes: 40320

slurm:
  account: your_account
  partition: your_partition
  default_qos: ""
  kmersutra_qos: 4week
  array_concurrency:
    kraken2: 1
    metabuli: 1
    minimap2: 2
    kmersutra: 1

kraken2:
  confidence: 0.0
  failure_policy: continue

metabuli:
  min_score: 0.008
  max_ram_gb: 120
  failure_policy: continue

kmersutra:
  enabled: true
  failure_policy: continue
  timeout_minutes: 40100
  screen_preset: exact
  call_preset: lineage_aware
  same_genus_reportable_min_fraction: 0.05
  write_parquet_outputs: false

provenance:
  checksum_inputs: true

reporting:
  focus_taxa:
    - Plasmodium
  top_n: 20
  max_table_rows: 5000
